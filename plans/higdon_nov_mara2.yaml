id: "higdon_nov_mara2_pt"
name: "Hal Higdon: Novice 2 (Principiante 2)"
description: "Hal Higdon: Novice 2 (Principiante 2): \"O Novice 2 foi pensado para ficar entre os planos de maratona Novice 1 e Intermediate 1. Destina-se a corredores que já podem ter terminado a primeira maratona e querem acrescentar um pouco mais de quilometragem na preparação da segunda ou terceira, com o objetivo de melhorar os tempos ou até de se qualificar para a Maratona de Boston.\" (mais detalhes na ligação abaixo)"
units: "km"
source: "https://www.halhigdon.com/training-programs/marathon-training/novice-2-marathon/"
