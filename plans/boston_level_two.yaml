id: boston_level_two_pt
source: https://www.baa.org//races/boston-marathon/enter/training/leveltwo
name: Plano de Treino de Maratona Boston Nível Dois
description:
  "O Nível Dois (iniciante a intermédio) foi concebido para uma média de cinco dias
  de corrida por semana. O plano segue uma progressão de volume que começa nos 48 km
  semanais e chega aos 72 km nas semanas de pico. Os treinos longos chegam aos 29-32 km.
  Abreviaturas: RM = ritmo de maratona, RMM = ritmo de meia maratona, R10K = ritmo de 10 km."
units: km
type: Marathon
