id: "higdon_int_half2_pt"
name: "Hal Higdon: Meia Maratona Intermediate 2 (Intermédio 2)"
description: "Hal Higdon: Meia Maratona Intermediate 2 (Intermédio 2): \"A principal diferença entre o Intermediate 1 e o Intermediate 2 é que este programa inclui um dia de treino de velocidade. Os dois existem em paralelo, como a Terra 1 e a Terra 2 da banda desenhada. As segundas-feiras são de treino cruzado, a começar nos 30 minutos e a chegar à hora na semana 11, uma semana antes da meia maratona. As terças e quintas são dias leves, de 5 a 8 km (3 a 5 milhas). Entre elas, à quarta-feira, faz-se trabalho de velocidade, alternando corridas em ritmo de limiar com treino intervalado em pista. A sexta-feira é de descanso, seguida de corridas a ritmo de prova ao sábado e de corridas longas ao domingo, que começam nos 8 km (5 milhas) e chegam aos 19 km (12 milhas) uma semana antes da meia maratona. Este plano, sem dúvida, é para corredores experientes: pessoas que deixaram para trás as origens de principiante e querem melhorar o desempenho.\" (mais detalhes na ligação abaixo)"
units: "km"
source: "https://www.halhigdon.com/training-programs/half-marathon-training/intermediate-2-half-marathon/"
type: "Half Marathon"
